<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bora Junto</title>
<style>
:root{--bg:#0d110e;--card:#171d18;--card2:#1f2721;--lima:#8fe05a;--texto:#f2f5ef;--mudo:#9aa597;--linha:#2a342c;--erro:#ff8a7a;--on-lima:#10200a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
h1,h2,h3{margin:0 0 .4em;color:var(--texto);font-weight:700}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(180deg,rgba(13,17,14,.25),rgba(13,17,14,.8)),url(foto-capa.jpg) center/cover,radial-gradient(circle at 75% 0,#2f6a22 0,#0f1a10 62%);min-height:210px;padding:30px 16px 0;overflow:hidden}
.hero h1{font-size:2.2rem;margin:0;color:var(--texto)}
.hero p{margin:.3em 0 0;color:#cfd9cb;max-width:560px}
.hero svg{display:block;width:100%;height:70px;margin-top:10px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 14px;border:1px solid var(--linha)}
.card h3{font-size:1.1rem}
.card.ev{padding:0;overflow:hidden}
.topo{height:130px;position:relative}
.c-trilha{background:linear-gradient(0deg,rgba(13,17,14,.7),rgba(13,17,14,.05)),url(foto-trilha.jpg) center/cover,linear-gradient(135deg,#3b7a2a,#10200f)}
.c-cachoeira{background:linear-gradient(0deg,rgba(13,17,14,.7),rgba(13,17,14,.05)),url(foto-cachoeira.jpg) center/cover,linear-gradient(135deg,#1f7a80,#0c2326)}
.c-camping{background:linear-gradient(0deg,rgba(13,17,14,.7),rgba(13,17,14,.05)),url(foto-camping.jpg) center/cover,linear-gradient(135deg,#9a5d22,#1f1409)}
.c-passeio{background:linear-gradient(0deg,rgba(13,17,14,.7),rgba(13,17,14,.05)),url(foto-passeio.jpg) center/cover,linear-gradient(135deg,#6a4a9a,#170f24)}
.c-viagem{background:linear-gradient(0deg,rgba(13,17,14,.7),rgba(13,17,14,.05)),url(foto-viagem.jpg) center/cover,linear-gradient(135deg,#2a5fa8,#0b1626)}
.tag{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);border-radius:99px;padding:2px 12px;font-size:.8rem}
.corpo{padding:14px 16px 16px}
.linha{display:flex;gap:14px}
.dia{min-width:46px;text-align:center}
.dia small{display:block;color:var(--mudo);font-size:.7rem;font-weight:700;letter-spacing:.05em}
.dia b{font-size:1.6rem;line-height:1.1}
.chip{background:var(--card2);color:var(--lima);border-radius:99px;padding:2px 10px;font-size:.82rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.meta{color:var(--mudo);font-size:.9rem}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.92rem;color:#cfd9cb}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--linha);border-radius:12px;font:inherit;background:var(--card2);color:var(--texto)}
::placeholder{color:var(--mudo)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--lima);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--lima);color:var(--on-lima);font-weight:700}
button:disabled{opacity:.5}
button.sec{background:transparent;color:var(--lima);border:1px solid var(--lima)}
button.full{width:100%;margin-top:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.pills{display:flex;gap:8px;overflow-x:auto;margin:12px 0 4px;padding-bottom:4px}
.pill{background:var(--card2);color:var(--texto);padding:6px 14px;border-radius:99px;font-weight:500;font-size:.85rem;border:1px solid var(--linha);white-space:nowrap}
.pill.on{background:var(--lima);color:var(--on-lima);border-color:var(--lima);font-weight:700}
.msg{padding:10px 12px;border-radius:12px;margin-top:12px;background:var(--card2);color:var(--lima)}
.msg.erro{background:#3a1d19;color:var(--erro)}
nav{position:fixed;bottom:0;left:0;right:0;background:#0a0d0b;border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border-radius:0;padding:10px 2px 8px;font-size:.7rem;color:var(--mudo);font-weight:500}
nav button.on{color:var(--lima);font-weight:700}
nav .ic{display:block;font-size:1.25rem;line-height:1.3}
nav .mais{color:var(--lima);font-weight:700}
nav .mais span{display:grid;place-items:center;width:46px;height:46px;margin:-24px auto 2px;border-radius:50%;background:var(--lima);color:var(--on-lima);font-size:1.7rem;border:4px solid #0a0d0b}
.vazio{text-align:center;color:var(--mudo);padding:28px 10px}
.auth{max-width:420px;margin:0 auto}
.chat{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:10px;height:320px;overflow-y:auto;margin-bottom:10px}
.bolha{background:var(--card2);border-radius:12px;padding:6px 10px;margin:6px 0;max-width:85%;word-wrap:break-word}
.bolha.eu{background:var(--lima);color:var(--on-lima);margin-left:auto}
.bolha small{display:block;opacity:.7;font-size:.75rem}
.prev{height:150px;border-radius:12px;margin-top:8px;background:var(--card2) center/cover;display:none}
.link{background:none;color:var(--mudo);padding:4px 0;font-weight:500;font-size:.8rem;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:420px;width:100%;margin:0}
.voltar{background:none;color:var(--lima);padding:0 0 8px;font-weight:600}
.phead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--lima);color:var(--on-lima);display:grid;place-items:center;font-size:1.8rem;font-weight:700}
.stats{display:flex;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:12px;margin-bottom:8px;text-align:center;color:var(--mudo);font-size:.85rem}
.stats>div{flex:1}.stats b{display:block;font-size:1.5rem;color:var(--lima)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== COLE AQUI OS DADOS DO SEU SUPABASE ======
const SUPABASE_URL = 'https://sheraatvpsncqbhjmwyn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoZXJhYXR2cHNuY3FiaGptd3luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMjkxMzQsImV4cCI6MjEwOTYwNTEzNH0.SdFZJbEYcivcUmqZ3FhWG32j9iS81E7VbtRo87CpMXA';
// =================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const CATS = {trilha:'Trilha',cachoeira:'Cachoeira',camping:'Camping',passeio:'Passeio',viagem:'Viagem'};
const DIFS = {facil:'Fácil',moderada:'Moderada',dificil:'Difícil'};
const CIDADES = ['Gramado','Canela','São Francisco de Paula','Cambará do Sul','Nova Petrópolis','Igrejinha','Três Coroas','Picada Café'];
const S = {user:undefined,profile:null,tab:'inicio',acts:[],f:{city:'',cat:'',dif:''},msg:null,authMode:'login',edit:null,group:null,msgs:[],opts:[],canal:null,rep:null,blocks:[]};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts = (o, sel) => Object.entries(o).map(([k,v]) => `<option value="${k}" ${k===sel?'selected':''}>${v}</option>`).join('');
const dataTxt = a => a.date_mode === 'a_combinar' ? 'Data a combinar' : new Date(a.event_date + 'T12:00').toLocaleDateString('pt-BR');
const msgHtml = () => S.msg ? `<div class="msg ${S.msg.erro?'erro':''}">${esc(S.msg.t)}</div>` : '';
const say = (t, erro) => { S.msg = {t, erro}; render(); };

async function loadActs() {
  const {data, error} = await sb.from('activities')
    .select('*, creator:profiles!creator_id(name), interests(user_id, profiles(name)), reviews(user_id, rating, comment, profiles(name))')
    .order('created_at', {ascending:false});
  if (error) return say('Não foi possível carregar as atividades: ' + error.message, true);
  S.acts = data;
}
async function loadProfile() {
  const {data} = await sb.from('profiles').select('*').eq('id', S.user.id).single();
  S.profile = data;
}

// ---------- Telas ----------
function badge(a) {
  if (a.date_mode === 'definida' && a.event_date) {
    const d = new Date(a.event_date + 'T12:00');
    return `<div class="dia"><small>${d.toLocaleDateString('pt-BR', {month:'short'}).replace('.', '').toUpperCase()}</small><b>${d.getDate()}</b></div>`;
  }
  return '<div class="dia"><small>DATA</small><b>?</b></div>';
}
function cardAtividade(a) {
  const eu = a.interests.some(i => i.user_id === S.user.id);
  const dono = a.creator_id === S.user.id;
  return `<div class="card ev"><div class="topo c-${a.category}" ${a.cover_url ? `style="background:linear-gradient(0deg,rgba(13,17,14,.7),rgba(13,17,14,.05)),url('${esc(a.cover_url)}') center/cover"` : ''}><span class="tag">${CATS[a.category]}</span></div>
  <div class="corpo"><div class="linha">${badge(a)}<div><h3 style="margin:0 0 4px">${esc(a.title)}</h3>
  <div class="meta">📍 ${esc(a.city)} · ${DIFS[a.difficulty]} · ${dataTxt(a)}</div>
  <div class="meta">por ${esc(a.creator?.name || 'alguém')} · ${a.interests.length} interessado(s)${mediaTxt(a) ? ' · ' + mediaTxt(a) : ''}</div></div></div>
  ${a.description ? `<p>${esc(a.description)}</p>` : ''}
  <button class="full ${eu ? 'sec' : ''}" onclick="toggleInteresse('${a.id}',${eu})">${eu ? 'Sair do grupo' : 'Bora junto'}</button>
  ${dono ? `<div class="row" style="margin-top:8px"><button class="sec" onclick="editar('${a.id}')">Editar</button><button class="sec" onclick="excluir('${a.id}')">Excluir</button></div>` : `<div class="row" style="margin-top:6px"><button class="link" onclick="abreDenuncia('atividade','${a.id}','${a.creator_id}')">Denunciar</button><button class="link" onclick="bloquear('${a.creator_id}')">Bloquear criador</button></div>`}</div></div>`;
}
const lista = (arr, vazio) => arr.length ? arr.map(cardAtividade).join('') : `<div class="vazio">${vazio}</div>`;

function telaInicio() {
  const nome = (S.profile?.name || '').split(' ')[0];
  return `<div class="hero"><h1>Bora Junto</h1><p>${nome ? 'Olá, ' + esc(nome) + '. ' : ''}Atividades ao ar livre na Serra Gaúcha, sem data marcada ou com data definida.</p>
  <svg viewBox="0 0 400 70" preserveAspectRatio="none"><path d="M0 70V40l60-30 50 35 70-40 80 45 60-30 80 35v15z" fill="#1d3a1c"/><path d="M0 70V55l80-25 70 30 90-35 70 30 90-20v35z" fill="#0d110e"/></svg></div>
  <div class="wrap"><h2>Novidades</h2>${lista(S.acts.slice(0,5), 'Nenhuma atividade ainda. Seja o primeiro a criar uma!')}</div>`;
}
function filtrar() {
  const f = S.f;
  return S.acts.filter(a => (!f.city || a.city.toLowerCase().includes(f.city.toLowerCase())) && (!f.cat || a.category === f.cat) && (!f.dif || a.difficulty === f.dif));
}
function telaExplorar() {
  const f = S.f;
  const chip = (k, n) => `<button class="pill ${f.cat === k ? 'on' : ''}" onclick="S.f.cat='${k}';render()">${n}</button>`;
  return `<div class="wrap"><h2>Explorar</h2>
  <input id="fc" list="cidades" value="${esc(f.city)}" placeholder="🔍 Buscar por cidade (Gramado, Canela...)" aria-label="Cidade" oninput="S.f.city=this.value;filtra()">
  <div class="pills">${chip('', 'Todos')}${Object.entries(CATS).map(([k, n]) => chip(k, n)).join('')}</div>
  <label for="fd">Dificuldade</label><select id="fd" onchange="S.f.dif=this.value;filtra()"><option value="">Todas</option>${opts(DIFS, f.dif)}</select>
  <div id="res" style="margin-top:16px">${lista(filtrar(), 'Nenhuma atividade encontrada com esses filtros.')}</div></div>`;
}
function filtra() { $('res').innerHTML = lista(filtrar(), 'Nenhuma atividade encontrada com esses filtros.'); }
function telaCriar() {
  const a = S.acts.find(x => x.id === S.edit) || {};
  const ed = !!a.id;
  return `<div class="wrap"><h2>${ed ? 'Editar atividade' : 'Criar atividade'}</h2><form onsubmit="criar(event)">
  <label for="t">Título</label><input id="t" required maxlength="80" value="${esc(a.title)}" placeholder="Ex.: Trilha até a Cascata do Caracol">
  <label for="d">Descrição</label><textarea id="d" rows="3" maxlength="500" placeholder="Ponto de encontro, o que levar, ritmo...">${esc(a.description)}</textarea>
  <div class="row"><div><label for="c">Categoria</label><select id="c">${opts(CATS, a.category)}</select></div>
  <div><label for="df">Dificuldade</label><select id="df">${opts(DIFS, a.difficulty)}</select></div></div>
  <label for="ci">Cidade</label><input id="ci" list="cidades" required value="${esc(a.city)}" placeholder="Ex.: Canela">
  <label for="dm">Data</label><select id="dm" onchange="$('dw').style.display=this.value==='definida'?'block':'none'">
    <option value="a_combinar" ${a.date_mode !== 'definida' ? 'selected' : ''}>A combinar com o grupo</option>
    <option value="definida" ${a.date_mode === 'definida' ? 'selected' : ''}>Data definida</option></select>
  <div id="dw" style="display:${a.date_mode === 'definida' ? 'block' : 'none'}"><label for="ed">Dia</label><input id="ed" type="date" value="${a.event_date || ''}"></div>
  <label for="cv">Foto de capa (opcional)</label><input id="cv" type="file" accept="image/*" onchange="prevCapa(this)">
  <div id="pv" class="prev" ${a.cover_url ? `style="display:block;background-image:url('${esc(a.cover_url)}')"` : ''}></div>
  <button id="bt" class="full">${ed ? 'Salvar alterações' : 'Publicar atividade'}</button>
  ${ed ? `<button type="button" class="sec full" onclick="go('explorar')">Cancelar</button>` : ''}
  </form>${msgHtml()}</div>`;
}
function telaComunidade() {
  if (S.group) return telaGrupo();
  const meus = S.acts.filter(a => a.interests.some(i => i.user_id === S.user.id));
  return `<div class="wrap"><h2>Meus grupos</h2><p class="meta">Atividades em que você demonstrou interesse. Abra o grupo para conversar e votar na data.</p>
  ${meus.length ? meus.map(a => `<div class="card"><h3>${esc(a.title)}</h3><div class="meta">${esc(a.city)} · ${dataTxt(a)}</div>
    <p><b>Participantes:</b> ${a.interests.map(i => esc(i.profiles?.name || 'Sem nome')).join(', ')}</p>
    <div class="row"><button onclick="abrirGrupo('${a.id}')">Abrir grupo</button><button class="sec" onclick="toggleInteresse('${a.id}',true)">Sair do grupo</button></div></div>`).join('') : '<div class="vazio">Você ainda não está em nenhum grupo. Vá em Explorar e toque em “Bora junto”.</div>'}</div>`;
}
const fd = d => new Date(d + 'T12:00').toLocaleDateString('pt-BR');
function chatHtml() {
  return S.msgs.length ? S.msgs.map(m => `<div class="bolha ${m.user_id === S.user.id ? 'eu' : ''}"><small>${esc(m.profiles?.name || 'Alguém')}</small>${esc(m.content)}${m.user_id !== S.user.id ? `<div><button class="link" onclick="abreDenuncia('mensagem','${m.id}','${m.user_id}')">Denunciar</button> <button class="link" onclick="bloquear('${m.user_id}')">Bloquear</button></div>` : ''}</div>`).join('') : '<div class="vazio">Nenhuma mensagem ainda. Diga um oi!</div>';
}
function telaGrupo() {
  const a = S.acts.find(x => x.id === S.group);
  if (!a) return '<div class="wrap vazio">Grupo não encontrado.</div>';
  const dono = a.creator_id === S.user.id;
  const ops = S.opts.length ? S.opts.map(o => { const eu = o.date_votes.some(v => v.user_id === S.user.id);
    return `<div class="row" style="align-items:center;margin-bottom:8px"><span><b>${fd(o.option_date)}</b><br><span class="meta">${o.date_votes.length} voto(s)</span></span>
    <button class="${eu ? 'sec' : ''}" onclick="votar('${o.id}',${eu})">${eu ? 'Tirar voto' : 'Votar'}</button>
    ${dono ? `<button class="sec" onclick="definirData('${o.option_date}')">Definir</button>` : ''}</div>`; }).join('') : '<p class="meta">Ninguém sugeriu data ainda.</p>';
  return `<div class="wrap"><button class="voltar" onclick="go('comunidade')">← Voltar</button>
  <h2>${esc(a.title)}</h2><div class="meta">${esc(a.city)} · ${dataTxt(a)} · ${a.interests.length} participante(s)</div>
  <h3 style="margin-top:18px">Datas</h3><div class="card">${ops}
  <div class="row" style="margin-top:8px"><input id="nd" type="date"><button class="sec" onclick="propor()">Sugerir data</button></div>
  ${dono ? '<p class="meta">Como criador, toque em “Definir” para fixar a data escolhida.</p>' : ''}</div>
  ${avaliacaoHtml(a)}<h3>Chat do grupo</h3><div id="chat" class="chat">${chatHtml()}</div>
  <div class="row"><input id="cm" maxlength="1000" placeholder="Escreva uma mensagem" onkeydown="if(event.key==='Enter')enviar()"><button style="flex:0 0 auto" onclick="enviar()">Enviar</button></div></div>`;
}
function perfilTopo(p) {
  const criadas = S.acts.filter(a => a.creator_id === S.user.id).length;
  const grupos = S.acts.filter(a => a.interests.some(i => i.user_id === S.user.id)).length;
  return `<div class="phead"><div class="avatar">${esc((p.name || '?')[0].toUpperCase())}</div><div><h2 style="margin:0">${esc(p.name || 'Sem nome')}</h2><div class="meta">${esc(p.city || '')}</div></div></div>
  <div class="stats"><div><b>${criadas}</b>Atividades criadas</div><div><b>${grupos}</b>Grupos</div></div>`;
}
function telaPerfil() {
  const p = S.profile || {};
  return `<div class="wrap">${perfilTopo(p)}<form onsubmit="salvaPerfil(event)">
  <label for="pn">Nome</label><input id="pn" required maxlength="60" value="${esc(p.name)}">
  <label for="pc">Cidade</label><input id="pc" list="cidades" value="${esc(p.city)}">
  <label for="pi">Interesses (separados por vírgula)</label><input id="pi" value="${esc((p.interests||[]).join(', '))}" placeholder="trilha, camping, cachoeira">
  <label for="pb">Sobre mim</label><textarea id="pb" rows="3" maxlength="300">${esc(p.bio)}</textarea>
  <button class="full">Salvar perfil</button></form>${msgHtml()}
  <h3 style="margin-top:24px">Usuários bloqueados</h3>
  ${S.blocks.length ? S.blocks.map(b => `<div class="row" style="align-items:center;margin-bottom:8px"><span>${esc(b.blocked_name || 'Usuário')}</span><button class="sec" onclick="desbloquear('${b.blocked_id}')">Desbloquear</button></div>`).join('') : '<p class="meta">Você não bloqueou ninguém.</p>'}
  <p class="meta">${esc(S.user.email)}</p><button class="sec full" onclick="sair()">Sair da conta</button></div>`;
}
function telaAuth() {
  const cad = S.authMode === 'cadastro';
  return `<div class="hero"><h1>Bora Junto</h1><p>Encontre gente para trilhas, cachoeiras e camping na Serra Gaúcha.</p>
  <svg viewBox="0 0 400 70" preserveAspectRatio="none"><path d="M0 70V40l60-30 50 35 70-40 80 45 60-30 80 35v15z" fill="#1d3a1c"/><path d="M0 70V55l80-25 70 30 90-35 70 30 90-20v35z" fill="#0d110e"/></svg></div>
  <div class="wrap auth"><h2>${cad ? 'Criar conta' : 'Entrar'}</h2><form onsubmit="autentica(event)">
  ${cad ? '<label for="an">Nome</label><input id="an" required maxlength="60">' : ''}
  <label for="ae">E-mail</label><input id="ae" type="email" required autocomplete="email">
  <label for="as">Senha</label><input id="as" type="password" required minlength="6" autocomplete="${cad?'new-password':'current-password'}">
  <button class="full">${cad ? 'Criar conta' : 'Entrar'}</button></form>${msgHtml()}
  <button class="sec full" onclick="S.authMode='${cad?'login':'cadastro'}';S.msg=null;render()">${cad ? 'Já tenho conta' : 'Quero criar uma conta'}</button></div>`;
}

// ---------- Ações ----------
async function autentica(e) {
  e.preventDefault();
  const email = $('ae').value.trim(), password = $('as').value;
  if (S.authMode === 'cadastro') {
    const {data, error} = await sb.auth.signUp({email, password, options:{data:{name:$('an').value.trim()}}});
    if (error) return say('Erro: ' + error.message, true);
    if (!data.session) say('Conta criada. Confirme seu e-mail e depois entre.');
  } else {
    const {error} = await sb.auth.signInWithPassword({email, password});
    if (error) say('E-mail ou senha incorretos.', true);
  }
}
async function sair() { await sb.auth.signOut(); }
function redimensiona(file, max = 1100) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : no(new Error('Falha ao processar a imagem')), 'image/jpeg', 0.8);
    };
    img.onerror = () => no(new Error('Imagem inválida'));
    img.src = u;
  });
}
function prevCapa(inp) {
  const f = inp.files[0], pv = $('pv');
  if (!f) { pv.style.display = 'none'; return; }
  pv.style.backgroundImage = `url(${URL.createObjectURL(f)})`; pv.style.display = 'block';
}
async function criar(e) {
  e.preventDefault();
  const btn = $('bt'); if (btn.disabled) return; btn.disabled = true; // evita publicar duas vezes
  const modo = $('dm').value;
  if (modo === 'definida' && !$('ed').value) { btn.disabled = false; return say('Escolha o dia da atividade.', true); }
  const campos = {title: $('t').value.trim(), description: $('d').value.trim(), category: $('c').value, difficulty: $('df').value,
    city: $('ci').value.trim(), date_mode: modo, event_date: modo === 'definida' ? $('ed').value : null};
  const arq = $('cv').files[0];
  if (arq) {
    try {
      btn.textContent = 'Enviando foto…';
      const blob = await redimensiona(arq);
      const path = S.user.id + '/' + crypto.randomUUID() + '.jpg';
      const {error: e1} = await sb.storage.from('capas').upload(path, blob, {contentType: 'image/jpeg'});
      if (e1) throw e1;
      campos.cover_url = sb.storage.from('capas').getPublicUrl(path).data.publicUrl;
    } catch (err) { return say('Erro ao enviar a foto: ' + err.message, true); }
  }
  if (S.edit) {
    const {error} = await sb.from('activities').update(campos).eq('id', S.edit);
    if (error) return say('Erro ao salvar: ' + error.message, true);
  } else {
    const {data, error} = await sb.from('activities').insert({creator_id: S.user.id, ...campos}).select().single();
    if (error) return say('Erro ao publicar: ' + error.message, true);
    await sb.from('interests').insert({activity_id: data.id, user_id: S.user.id}); // o criador entra no grupo
  }
  await loadActs(); S.msg = null; go('explorar');
}
function editar(id) { S.edit = id; S.tab = 'criar'; S.msg = null; render(); window.scrollTo(0,0); }
async function excluir(id) {
  if (!confirm('Excluir esta atividade? O grupo de interessados também será removido.')) return;
  const {data, error} = await sb.from('activities').delete().eq('id', id).select();
  if (error || !data.length) return alert('Não foi possível excluir. ' + (error ? error.message : ''));
  await loadActs(); render();
}
async function toggleInteresse(id, jaTem) {
  const q = sb.from('interests');
  const {error} = jaTem ? await q.delete().match({activity_id:id, user_id:S.user.id}) : await q.insert({activity_id:id, user_id:S.user.id});
  if (error) return say('Erro: ' + error.message, true);
  await loadActs(); render();
}
async function salvaPerfil(e) {
  e.preventDefault();
  const {error} = await sb.from('profiles').update({
    name: $('pn').value.trim(), city: $('pc').value.trim(), bio: $('pb').value.trim(),
    interests: $('pi').value.split(',').map(s => s.trim()).filter(Boolean)
  }).eq('id', S.user.id);
  if (error) return say('Erro ao salvar: ' + error.message, true);
  await loadProfile(); say('Perfil salvo.');
}
function go(t) { fechaCanal(); S.tab = t; S.edit = null; S.group = null; S.msg = null; render(); window.scrollTo(0,0); }

// ---------- Grupo: chat e votação ----------
function fechaCanal() { if (S.canal) { sb.removeChannel(S.canal); S.canal = null; } }
async function loadMsgs() {
  const {data} = await sb.from('messages').select('*, profiles(name)').eq('activity_id', S.group).order('created_at');
  S.msgs = data || [];
}
async function loadOpts() {
  const {data} = await sb.from('date_options').select('*, date_votes(user_id)').eq('activity_id', S.group).order('option_date');
  S.opts = data || [];
}
function renderChat() { const c = $('chat'); if (c) { c.innerHTML = chatHtml(); c.scrollTop = c.scrollHeight; } }
async function abrirGrupo(id) {
  fechaCanal(); S.nota = null; S.group = id; S.msgs = []; S.opts = [];
  await Promise.all([loadMsgs(), loadOpts()]);
  render(); renderChat();
  S.canal = sb.channel('chat-' + id).on('postgres_changes', {event:'INSERT', schema:'public', table:'messages', filter:'activity_id=eq.' + id},
    async () => { await loadMsgs(); renderChat(); }).subscribe();
}
async function enviar() {
  const v = $('cm').value.trim(); if (!v) return; $('cm').value = '';
  const {error} = await sb.from('messages').insert({activity_id: S.group, user_id: S.user.id, content: v});
  if (error) return alert('Não foi possível enviar: ' + error.message);
  await loadMsgs(); renderChat();
}
async function propor() {
  const d = $('nd').value; if (!d) return alert('Escolha uma data.');
  const {error} = await sb.from('date_options').insert({activity_id: S.group, proposed_by: S.user.id, option_date: d});
  if (error) return alert(error.code === '23505' ? 'Essa data já foi sugerida.' : 'Erro: ' + error.message);
  await loadOpts(); render(); renderChat();
}
async function votar(id, jaTem) {
  const q = sb.from('date_votes');
  const {error} = jaTem ? await q.delete().match({option_id: id, user_id: S.user.id}) : await q.insert({option_id: id, user_id: S.user.id});
  if (error) return alert('Erro: ' + error.message);
  await loadOpts(); render(); renderChat();
}
async function definirData(d) {
  if (!confirm('Definir ' + fd(d) + ' como a data da atividade?')) return;
  const {error} = await sb.from('activities').update({date_mode: 'definida', event_date: d}).eq('id', S.group);
  if (error) return alert('Erro: ' + error.message);
  await loadActs(); render(); renderChat();
}

// ---------- Denúncia e bloqueio ----------
async function loadBlocks() {
  const {data} = await sb.from('blocks').select('blocked_id, blocked_name').eq('blocker_id', S.user.id);
  S.blocks = data || [];
}
function nomeDe(uid) {
  for (const a of S.acts) {
    if (a.creator_id === uid && a.creator?.name) return a.creator.name;
    const i = a.interests.find(x => x.user_id === uid && x.profiles?.name); if (i) return i.profiles.name;
  }
  const m = S.msgs.find(x => x.user_id === uid && x.profiles?.name); return m ? m.profiles.name : 'este usuário';
}
function modalHtml() {
  if (!S.rep) return '';
  return `<div class="modal"><div class="card"><h3>Denunciar</h3>
  <label for="rm">Motivo</label><select id="rm"><option value="spam">Spam ou propaganda</option><option value="ofensivo">Conteúdo ofensivo ou assédio</option><option value="falso">Perfil ou atividade falsa</option><option value="perigoso">Atividade perigosa ou ilegal</option><option value="outro">Outro</option></select>
  <label for="rd">Detalhes (opcional)</label><textarea id="rd" rows="3" maxlength="500"></textarea>
  <div class="row" style="margin-top:14px"><button class="sec" onclick="fechaRep()">Cancelar</button><button onclick="enviaDenuncia()">Enviar</button></div></div></div>`;
}
function abreDenuncia(tipo, id, user) { S.rep = {tipo, id, user}; render(); renderChat(); }
function fechaRep() { S.rep = null; render(); renderChat(); }
async function enviaDenuncia() {
  const r = S.rep;
  const {error} = await sb.from('reports').insert({reporter_id: S.user.id, target_type: r.tipo, target_id: r.id, reported_user_id: r.user,
    reason: $('rm').value, details: $('rd').value.trim()});
  if (error) return alert('Não foi possível enviar: ' + error.message);
  fechaRep(); alert('Denúncia enviada. Obrigado por ajudar a manter a comunidade segura.');
}
async function bloquear(uid) {
  const nome = nomeDe(uid);
  if (!confirm('Bloquear ' + nome + '? Você não verá mais as atividades e mensagens dessa pessoa, e ela também não verá as suas.')) return;
  const {error} = await sb.from('blocks').insert({blocker_id: S.user.id, blocked_id: uid, blocked_name: nome});
  if (error) return alert('Erro ao bloquear: ' + error.message);
  await loadBlocks(); await loadActs();
  if (S.group) { if (S.acts.some(a => a.id === S.group)) await loadMsgs(); else { fechaCanal(); S.group = null; } }
  render(); renderChat();
}
async function desbloquear(uid) {
  const {error} = await sb.from('blocks').delete().match({blocker_id: S.user.id, blocked_id: uid});
  if (error) return alert('Erro: ' + error.message);
  await loadBlocks(); await loadActs(); render();
}

// ---------- Avaliações ----------
const hoje = () => new Date().toLocaleDateString('en-CA'); // AAAA-MM-DD
const passou = a => a.date_mode === 'definida' && a.event_date && a.event_date <= hoje();
function mediaTxt(a) {
  if (!a.reviews || !a.reviews.length) return '';
  const m = a.reviews.reduce((t, r) => t + r.rating, 0) / a.reviews.length;
  return `⭐ ${m.toFixed(1).replace('.', ',')} (${a.reviews.length})`;
}
function avaliacaoHtml(a) {
  if (!passou(a)) return `<h3 style="margin-top:18px">Avaliação</h3><p class="meta">A avaliação abre depois da data da atividade${a.date_mode === 'definida' ? '' : ' (defina a data primeiro)'}.</p>`;
  const minha = a.reviews.find(r => r.user_id === S.user.id);
  const nota = S.nota ?? minha?.rating ?? 0;
  const outros = a.reviews.filter(r => r.comment).map(r => `<div class="meta" style="margin-top:8px">${'★'.repeat(r.rating)} <b>${esc(r.profiles?.name || 'Alguém')}</b>: ${esc(r.comment)}</div>`).join('');
  return `<h3 style="margin-top:18px">Avaliação ${mediaTxt(a) ? '· ' + mediaTxt(a) : ''}</h3><div class="card"><p class="meta" style="margin-top:0">Como foi a experiência?</p>
  <div class="pills" id="est">${[1,2,3,4,5].map(n => `<button class="pill ${nota >= n ? 'on' : ''}" onclick="setNota(${n})">${n}★</button>`).join('')}</div>
  <textarea id="rc" rows="2" maxlength="300" placeholder="Comentário (opcional)">${esc(minha?.comment)}</textarea>
  <button class="full" onclick="salvaAval()">${minha ? 'Atualizar avaliação' : 'Enviar avaliação'}</button>${outros}</div>`;
}
function setNota(n) { S.nota = n; document.querySelectorAll('#est .pill').forEach((b, i) => b.classList.toggle('on', i + 1 <= n)); }
async function salvaAval() {
  const a = S.acts.find(x => x.id === S.group);
  const minha = a.reviews.find(r => r.user_id === S.user.id);
  const nota = S.nota ?? minha?.rating;
  if (!nota) return alert('Escolha de 1 a 5 estrelas.');
  const {error} = await sb.from('reviews').upsert({activity_id: S.group, user_id: S.user.id, rating: nota, comment: $('rc').value.trim() || null}, {onConflict: 'activity_id,user_id'});
  if (error) return alert('Não foi possível salvar: ' + error.message);
  S.nota = null; await loadActs(); render(); renderChat(); alert('Avaliação salva. Obrigado!');
}

// ---------- Render ----------
const ABAS = [['inicio','Início','🏠'],['explorar','Explorar','🧭'],['criar','Criar','＋'],['comunidade','Comunidade','👥'],['perfil','Perfil','👤']];
function render() {
  const dl = `<datalist id="cidades">${CIDADES.map(c => `<option value="${c}">`).join('')}</datalist>`;
  if (S.user === undefined) { $('app').innerHTML = '<div class="vazio" style="padding-top:40vh">Carregando…</div>'; return; }
  if (!S.user) { $('app').innerHTML = telaAuth(); return; }
  const tela = {inicio:telaInicio, explorar:telaExplorar, criar:telaCriar, comunidade:telaComunidade, perfil:telaPerfil}[S.tab]();
  $('app').innerHTML = tela + dl + `<nav>${ABAS.map(([k,n,i]) => k === 'criar' ? `<button class="mais" onclick="go('criar')"><span>${i}</span>${n}</button>` : `<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><span class="ic">${i}</span>${n}</button>`).join('')}</nav>` + modalHtml();
}
sb.auth.onAuthStateChange((_ev, session) => {
  S.user = session?.user ?? null;
  // setTimeout evita travar o Supabase ao fazer consultas dentro deste evento
  setTimeout(async () => {
    try {
      if (S.user) { await loadProfile(); await loadBlocks(); await loadActs(); S.msg = null; } else { S.profile = null; S.acts = []; }
    } catch (e) { S.msg = {t: 'Erro ao carregar: ' + e.message, erro: true}; }
    render();
  }, 0);
});
render();
</script>
