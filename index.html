<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bora Junto · Atividades ao ar livre em grupo na Serra Gaúcha</title>
<meta name="description" content="Encontre gente para trilhas, cachoeiras, camping e passeios na Serra Gaúcha. Crie uma atividade, forme o grupo e combinem a data juntos.">
<meta property="og:title" content="Bora Junto">
<meta property="og:description" content="Atividades ao ar livre em grupo na Serra Gaúcha: trilhas, cachoeiras, camping e passeios.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://tiagospier.github.io/Bora-junto/foto-capa.jpg">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d110e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bora Junto">
<style>
:root{--bg:#0b0f0c;--card:#151b16;--card2:#1e2620;--lima:#8fe05a;--texto:#f2f5ef;--mudo:#9aa597;--linha:#28322a;--erro:#ff8a7a;--on-lima:#10200a;--r:18px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--texto);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0 0 .4em;color:var(--texto);font-weight:750;letter-spacing:-.02em;line-height:1.2}
h2{font-size:1.5rem}
p{margin:.6em 0}
a{color:var(--lima)}
.i{flex:0 0 auto;vertical-align:-.2em}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px}
.st{color:var(--lima)}

/* Capa */
.hero{background:linear-gradient(180deg,rgba(11,15,12,.15) 0,rgba(11,15,12,.55) 55%,var(--bg) 100%),url(foto-capa.jpg) center/cover,radial-gradient(circle at 75% 0,#2f6a22 0,#0f1a10 62%);min-height:250px;padding:calc(34px + env(safe-area-inset-top,0px)) 16px 22px;display:flex;flex-direction:column;justify-content:flex-end}
.hero>*{width:100%;max-width:648px;margin-left:auto;margin-right:auto}
.hero .marca{font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--lima);margin-bottom:8px}
.hero h1{font-size:2.1rem;margin-bottom:0;text-wrap:balance}
.hero p{margin:.45em auto 0;color:#d5ddd1;text-wrap:pretty}

/* Cartões */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 14px;border:1px solid var(--linha)}
.card h3{font-size:1.12rem}
.card.ev{padding:0;overflow:hidden}
.topo{height:168px;position:relative}
.c-trilha{background:linear-gradient(0deg,rgba(11,15,12,.75),rgba(11,15,12,.05) 60%),url(foto-trilha.jpg) center/cover,linear-gradient(135deg,#3b7a2a,#10200f)}
.c-cachoeira{background:linear-gradient(0deg,rgba(11,15,12,.75),rgba(11,15,12,.05) 60%),url(foto-cachoeira.jpg) center/cover,linear-gradient(135deg,#1f7a80,#0c2326)}
.c-camping{background:linear-gradient(0deg,rgba(11,15,12,.75),rgba(11,15,12,.05) 60%),url(foto-camping.jpg) center/cover,linear-gradient(135deg,#9a5d22,#1f1409)}
.c-passeio{background:linear-gradient(0deg,rgba(11,15,12,.75),rgba(11,15,12,.05) 60%),url(foto-passeio.jpg) center/cover,linear-gradient(135deg,#6a4a9a,#170f24)}
.c-viagem{background:linear-gradient(0deg,rgba(11,15,12,.75),rgba(11,15,12,.05) 60%),url(foto-viagem.jpg) center/cover,linear-gradient(135deg,#2a5fa8,#0b1626)}
.tag{position:absolute;top:12px;left:12px;background:rgba(11,15,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:600}
.dia{position:absolute;left:12px;bottom:12px;min-width:52px;text-align:center;background:rgba(11,15,12,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:5px 10px}
.dia small{display:block;color:var(--lima);font-size:.68rem;font-weight:800;letter-spacing:.08em}
.dia b{font-size:1.45rem;line-height:1.1}
.dia.livre{color:var(--lima);font-size:.8rem;font-weight:700;padding:6px 12px}
.menu{position:absolute;top:10px;right:10px}
.menu summary{list-style:none;width:36px;height:36px;border-radius:50%;background:rgba(11,15,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu-l{position:absolute;right:0;top:42px;background:var(--card2);border:1px solid var(--linha);border-radius:14px;padding:6px;min-width:190px;z-index:5;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.menu-l button{display:block;width:100%;text-align:left;background:none;color:var(--texto);font-weight:500;padding:10px 12px;border-radius:10px;min-height:0}
.menu-l button:hover{background:rgba(255,255,255,.06)}
.menu-l button.per{color:var(--erro)}
.corpo{padding:14px 16px 16px}
.corpo h3{margin:0 0 8px;font-size:1.15rem;text-wrap:balance}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;color:#cfd9cb;font-size:.9rem;align-items:center}
.info span{display:inline-flex;gap:5px;align-items:center}
.dif{border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--linha);color:var(--texto)}
.d-facil{color:#a5ec77;border-color:#35522a}.d-moderada{color:#f2c96a;border-color:#5a4a22}.d-dificil{color:#ff9d8f;border-color:#5a2d27}
.desc{color:#cfd9cb;font-size:.95rem;margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--linha);flex-wrap:wrap}
.rodape .meta{display:inline-flex;align-items:center;gap:5px}
.extra{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.linha{display:flex;gap:14px}
.chip{background:var(--card2);color:var(--lima);border-radius:99px;padding:2px 10px;font-size:.82rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.meta{color:var(--mudo);font-size:.9rem}
.sec-t{margin-top:22px}
.cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 10px}
.cab h2{margin:0}
.cab .link{font-size:.9rem;color:var(--lima);text-decoration:none;font-weight:600}

/* Atalhos de categoria */
.cats{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 118px;height:84px;border-radius:16px;padding:0 0 9px 11px;display:flex;align-items:flex-end;color:#fff;font-size:.92rem;font-weight:700;text-align:left;border:1px solid var(--linha)}

/* Formulários */
label{display:block;font-weight:600;margin:14px 0 5px;font-size:.92rem;color:#cfd9cb}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--linha);border-radius:13px;font:inherit;background:var(--card2);color:var(--texto);min-height:48px}
textarea{resize:vertical}
input[type=file]{padding:9px;min-height:0;color:var(--mudo)}
input[type=file]::file-selector-button{font:inherit;font-weight:600;background:var(--card);color:var(--lima);border:1px solid var(--lima);border-radius:10px;padding:6px 12px;margin-right:10px}
::placeholder{color:var(--mudo)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lima);outline-offset:1px;border-color:transparent}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--lima);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:12px 16px;background:var(--lima);color:var(--on-lima);font-weight:700;min-height:48px;transition:transform .08s,filter .15s,background .15s}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:default}
button.sec{background:transparent;color:var(--lima);border:1px solid var(--lima)}
button.perigo{background:var(--erro);color:#2a0b07}
button.full{width:100%;margin-top:14px}
button.load{position:relative;color:transparent!important;pointer-events:none}
button.load::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--on-lima);border-right-color:transparent;animation:gira .7s linear infinite}
button.sec.load::after{border-color:var(--lima);border-right-color:transparent}
@keyframes gira{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px}.row>*{flex:1}
.busca{position:relative}.busca .i{position:absolute;left:14px;top:15px;color:var(--mudo);pointer-events:none}.busca input{padding-left:42px}
.senha{position:relative}.senha input{padding-right:84px}
.olho{position:absolute;right:6px;top:6px;min-height:36px;padding:6px 10px;background:none;color:var(--lima);font-size:.85rem;font-weight:600}
.pills{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.card .pills{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
.pill{background:var(--card2);color:var(--texto);padding:7px 15px;border-radius:99px;font-weight:500;font-size:.88rem;border:1px solid var(--linha);white-space:nowrap;min-height:38px}
.pill.on{background:var(--lima);color:var(--on-lima);border-color:var(--lima);font-weight:700}
.cont{margin:14px 0 10px}
.msg{padding:10px 12px;border-radius:12px;margin-top:12px;background:var(--card2);color:var(--lima)}
.msg.erro{background:#3a1d19;color:var(--erro)}
.link{background:none;color:var(--mudo);padding:4px 0;font-weight:500;font-size:.82rem;text-decoration:underline;min-height:0}
.voltar{background:none;color:var(--lima);padding:0 0 10px;font-weight:600;min-height:0;display:inline-flex;align-items:center;gap:4px}

/* Navegação */
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(9,12,10,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--linha);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;max-width:136px;background:none;border-radius:0;padding:9px 2px 8px;font-size:.7rem;color:var(--mudo);font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
nav button.on{color:var(--lima);font-weight:700}
nav .mais{color:var(--lima);font-weight:700}
nav .mais span{display:grid;place-items:center;width:50px;height:50px;margin:-26px auto 0;border-radius:50%;background:var(--lima);color:var(--on-lima);border:4px solid var(--bg);box-shadow:0 6px 18px rgba(143,224,90,.25)}
.sino{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:15;background:rgba(11,15,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:50%;width:44px;height:44px;min-height:0;padding:0;color:var(--texto);display:grid;place-items:center}
.badge{position:absolute;top:-4px;right:-4px;background:var(--lima);color:var(--on-lima);border-radius:99px;min-width:18px;height:18px;font-size:.7rem;font-weight:700;place-items:center;padding:0 4px}

/* Estados vazios, carregamento e avisos */
.vazio{text-align:center;color:var(--mudo);padding:30px 14px}
.vazio b{display:block;color:var(--texto);font-size:1.05rem;margin-top:10px}
.vazio p{margin:.3em auto 0;max-width:340px}
.vazio button{margin-top:16px}
.vz{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--card2);color:var(--lima)}
.splash{min-height:100vh;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:18px;margin-bottom:-92px}
.splash b{font-size:1.5rem;letter-spacing:-.02em}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--linha);border-top-color:var(--lima);animation:gira .8s linear infinite}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;z-index:40;display:grid;justify-items:center;gap:8px;padding:0 14px;pointer-events:none}
.toast{pointer-events:auto;max-width:440px;background:#22301f;color:var(--texto);border:1px solid #3d5a34;border-radius:14px;padding:11px 15px;font-size:.93rem;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:entra .22s ease-out}
.toast.erro{background:#3a1d19;border-color:#6b322b;color:#ffd0c9}
.toast.sai{opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s}
@keyframes entra{from{opacity:0;transform:translateY(-10px)}}
#offbar{display:none;position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:12;text-align:center;background:#3a1d19;color:#ffd0c9;font-size:.85rem;padding:6px 12px}
body.off #offbar{display:block}

/* Autenticação */
.auth{max-width:440px;margin:0 auto}
.aceite{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:16px}
.aceite input{width:20px;height:20px;min-height:0;margin-top:2px;flex:0 0 auto;accent-color:var(--lima)}

/* Grupo e chat */
.chat{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:10px 12px;height:340px;overflow-y:auto;margin-bottom:10px;overscroll-behavior:contain}
.bolha{background:var(--card2);border-radius:16px 16px 16px 5px;padding:7px 12px;margin:7px 0;max-width:85%;width:fit-content;overflow-wrap:anywhere}
.bolha.eu{background:var(--lima);color:var(--on-lima);margin-left:auto;border-radius:16px 16px 5px 16px}
.bolha small{display:block;opacity:.75;font-size:.74rem;font-weight:600}
.bolha time{display:block;opacity:.65;font-size:.7rem;text-align:right;margin-top:2px}
.mm summary{list-style:none;cursor:pointer;color:var(--mudo);font-size:.75rem;text-decoration:underline;width:fit-content}
.mm summary::-webkit-details-marker{display:none}
.envia{display:flex;gap:8px}.envia input{flex:1}.envia button{flex:0 0 48px;padding:0;display:grid;place-items:center}
.opc{display:flex;align-items:center;gap:8px;margin-bottom:10px}.opc>span{flex:1}.opc button{min-height:40px;padding:8px 14px}
.prev{height:160px;border-radius:14px;margin-top:8px;background:var(--card2) center/cover;display:none}
.mapa{width:100%;height:220px;border:0;border-radius:16px;margin-top:10px;background:var(--card)}
.clima{display:flex;gap:12px;align-items:center}.clima .ic{font-size:2rem}
.lotado{color:#ffb4a8;font-weight:600}

/* Participantes e conversas privadas */
.plist{padding:6px}
.pessoa{display:flex;align-items:center;gap:12px;width:100%;background:none;color:var(--texto);text-align:left;font-weight:400;padding:8px 10px;border-radius:12px}
.pessoa:hover{background:rgba(255,255,255,.04)}
.pessoa>span:not(.pav){flex:1;min-width:0;display:flex;flex-direction:column}
.pessoa>.i{color:var(--mudo)}
.pav{width:44px;height:44px;border-radius:50%;background:var(--lima) center/cover;color:var(--on-lima);display:grid;place-items:center;font-weight:700;font-size:1.1rem;flex:0 0 auto;overflow:hidden}
.pav svg{width:100%;height:100%;display:block}
.pav.g{width:88px;height:88px;font-size:2.2rem;margin:0 auto 10px}
.pcard{text-align:center}.pcard .chips{justify-content:center}.pcard p{overflow-wrap:anywhere}
.seg{display:flex;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:4px;margin:12px 0 16px}
.seg button{flex:1;background:none;color:var(--mudo);min-height:40px;padding:6px;border-radius:10px;font-weight:600;display:flex;justify-content:center;align-items:center;gap:6px}
.seg button.on{background:var(--card2);color:var(--texto)}
.nb{background:var(--lima);color:var(--on-lima);border-radius:99px;min-width:18px;height:18px;font-size:.7rem;font-weight:700;font-style:normal;display:inline-grid;place-items:center;padding:0 5px}
nav button{position:relative}nav .nb{position:absolute;top:5px;left:calc(50% + 6px)}
.dmhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dmhead h2{margin:0;font-size:1.2rem;min-width:0;overflow-wrap:anywhere}
.menu.inl{position:relative;top:0;right:0;margin-left:auto}.menu.inl summary{background:var(--card2)}
.chat.dm{height:calc(100dvh - 370px);min-height:240px}
.grp .topo{height:132px}
.grp .corpo h3{margin-bottom:6px}
.pilha{display:flex;align-items:center;margin-top:12px;color:var(--mudo);font-size:.88rem}
.pilha .pav{width:30px;height:30px;font-size:.8rem;border:2px solid var(--card);margin-left:-8px}
.pilha .pav:first-child{margin-left:0}
.pilha .mais-p{background:var(--card2);color:var(--texto);font-size:.72rem}
.pilha>span:last-child{margin-left:10px}
.fim{position:absolute;right:56px;top:12px;background:rgba(11,15,12,.78);border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:600;color:#ffd0c9}
.grp.velha .topo{filter:saturate(.45) brightness(.85)}
.gcapa{height:190px;border-radius:var(--r);position:relative;margin-bottom:14px;border:1px solid var(--linha)}
.sub-t{font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mudo);margin:22px 0 10px}
.conv{display:flex;align-items:center;gap:12px}.conv>div{flex:1;min-width:0}.conv h3{margin:0;font-size:1.02rem}

/* Janelas */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;z-index:20;animation:some .15s ease-out}
.modal .card{max-width:420px;width:100%;margin:0;box-shadow:0 20px 50px rgba(0,0,0,.55)}
@keyframes some{from{opacity:0}}
.notif{padding:11px 13px;border-radius:12px;margin-top:8px;background:var(--card2);cursor:pointer}
.notif.nova{border-left:3px solid var(--lima)}

/* Perfil e avatar */
.phead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--lima) center/cover;color:var(--on-lima);display:grid;place-items:center;font-size:1.9rem;font-weight:700;flex:0 0 auto;position:relative;cursor:pointer;margin:0}
.avatar input{display:none}.avatar .cam{position:absolute;right:-2px;bottom:-2px;background:var(--card);border:1px solid var(--linha);color:var(--texto);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.avatar svg:not(.i){width:100%;height:100%;border-radius:50%;display:block}
.mini{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--lima) center/cover;color:var(--on-lima);font-size:.72rem;font-weight:700;text-align:center;line-height:22px;vertical-align:middle;margin-right:4px;overflow:hidden;flex:0 0 auto}
.mini svg{width:22px;height:22px;border-radius:50%;display:block}
.sw{width:34px;height:34px;min-height:0;border-radius:50%;border:2px solid var(--linha);padding:0;flex:0 0 auto}.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--lima)}
.avprev{width:170px;height:170px;border-radius:50%;overflow:hidden;margin:6px auto 14px;border:3px solid var(--lima)}.avprev svg{width:100%;height:100%;display:block}
.avgrp{margin-top:14px}.avgrp h4{margin:0 0 6px;color:var(--mudo);font-size:.85rem;font-weight:600}.avrow{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:flex;background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:14px 8px;margin-bottom:8px;text-align:center;color:var(--mudo);font-size:.8rem}
.stats>div{flex:1;padding:0 6px}.stats>div+div{border-left:1px solid var(--linha)}.stats b{display:block;font-size:1.5rem;color:var(--lima)}

@media (min-width:720px){.hero{min-height:300px}.hero h1{font-size:2.6rem}.topo{height:200px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<div id="offbar" role="status">Sem conexão com a internet. Algumas informações podem estar desatualizadas.</div>
<noscript><p style="padding:24px;text-align:center">O Bora Junto precisa do JavaScript ativado para funcionar.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>

async function trocaFoto(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    const blob = await redimensiona(f, 400);
    const path = S.user.id + '/avatar-' + crypto.randomUUID() + '.jpg';
    const {error: e1} = await sb.storage.from('capas').upload(path, blob, {contentType: 'image/jpeg'});
    if (e1) throw e1;
    const url = sb.storage.from('capas').getPublicUrl(path).data.publicUrl;
    const {error: e2} = await sb.from('profiles').update({avatar_url: url}).eq('id', S.user.id);
    if (e2) throw e2;
    await loadProfile(); await loadActs(); say('Foto atualizada.');
  } catch (err) { say('Erro ao enviar a foto: ' + pt(err.message), true); }
}

function redimensiona(file, max = 1100) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : no(new Error('Falha ao processar a imagem')), 'image/jpeg', 0.8);
    };
    img.onerror = () => no(new Error('Imagem inválida'));
    img.src = u;
  });
}
function prevCapa(inp) {
  const f = inp.files[0], pv = $('pv');
  if (!f) { pv.style.display = 'none'; return; }
  pv.style.backgroundImage = `url(${URL.createObjectURL(f)})`; pv.style.display = 'block';
}
async function criar(e) {
  e.preventDefault();
  const btn = $('bt'); if (btn.disabled) return; // evita publicar duas vezes
  const rotulo = btn.textContent, solta = trava(btn);
  const falha = m => { solta(); btn.textContent = rotulo; say(m, true); };
  const modo = $('dm').value;
  if (modo === 'definida' && !$('ed').value) return falha('Escolha o dia da atividade.');
  const campos = {title: $('t').value.trim(), description: $('d').value.trim(), category: $('c').value, difficulty: $('df').value,
    city: $('ci').value.trim(), meeting_point: $('mp').value.trim() || null, max_people: parseInt($('mx').value) || null, date_mode: modo, event_date: modo === 'definida' ? $('ed').value : null};
  if (!campos.title || !campos.city) return falha('Preencha o título e a cidade.');
  try {
    const arq = $('cv').files[0];
    if (arq) {
      const blob = await redimensiona(arq);
      const path = S.user.id + '/' + crypto.randomUUID() + '.jpg';
      const {error: e1} = await sb.storage.from('capas').upload(path, blob, {contentType: 'image/jpeg'});
      if (e1) return falha('Erro ao enviar a foto: ' + pt(e1.message));
      campos.cover_url = sb.storage.from('capas').getPublicUrl(path).data.publicUrl;
    }
    const editando = !!S.edit;
    if (editando) {
      const {error} = await sb.from('activities').update(campos).eq('id', S.edit);
      if (error) return falha('Erro ao salvar: ' + pt(error.message));
    } else {
      const {data, error} = await sb.from('activities').insert({creator_id: S.user.id, ...campos}).select().single();
      if (error) return falha('Erro ao publicar: ' + pt(error.message));
      await sb.from('interests').insert({activity_id: data.id, user_id: S.user.id}); // o criador entra no grupo
    }
    await loadActs(); go('explorar'); toast(editando ? 'Alterações salvas.' : 'Atividade publicada!');
  } catch (err) { falha('Erro: ' + pt(err.message)); }
}

}
function nomeDe(uid) {
  if (S.parts[uid]?.name) return S.parts[uid].name;
  const t = dmCom(uid); if (t && dmOutro(t)?.name) return dmOutro(t).name;
  for (const a of S.acts) {
    if (a.creator_id === uid && a.creator?.name) return a.creator.name;
    const i = a.interests.find(x => x.user_id === uid && x.profiles?.name); if (i) return i.profiles.name;
  }
  const m = S.msgs.find(x => x.user_id === uid && x.profiles?.name); return m ? m.profiles.name : 'este usuário';
}
function modalHtml() {
  if (!S.rep) return '';
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Denunciar"><div class="card"><h3>Denunciar</h3>
  <label for="rm">Motivo</label><select id="rm"><option value="spam">Spam ou propaganda</option><option value="ofensivo">Conteúdo ofensivo ou assédio</option><option value="falso">Perfil ou atividade falsa</option><option value="perigoso">Atividade perigosa ou ilegal</option><option value="outro">Outro</option></select>
  <label for="rd">Detalhes (opcional)</label><textarea id="rd" rows="3" maxlength="500"></textarea>
  <div class="row" style="margin-top:14px"><button class="sec" onclick="fechaRep()">Cancelar</button><button onclick="enviaDenuncia()">Enviar</button></div></div></div>`;
}
function abreDenuncia(tipo, id, user) { S.rep = {tipo, id, user}; render(); renderChat(); }
function fechaRep() { S.rep = null; render(); renderChat(); }
async function enviaDenuncia() {
  const r = S.rep;
  const {error} = await sb.from('reports').insert({reporter_id: S.user.id, target_type: r.tipo, target_id: r.id, reported_user_id: r.user,
    reason: $('rm').value, details: (r.priv ? '[Conversa privada] ' : '') + $('rd').value.trim()});
  if (error) return toast('Não foi possível enviar: ' + pt(error.message), true);
  fechaRep(); toast('Denúncia enviada. Obrigado por ajudar a manter a comunidade segura.');
}
async function bloquear(uid) {
  const nome = nomeDe(uid);
  if (!await confirma('Bloquear ' + nome + '? Você não verá mais as atividades e mensagens dessa pessoa, e ela também não verá as suas.', 'Bloquear', true)) return;
  const {error} = await sb.from('blocks').insert({blocker_id: S.user.id, blocked_id: uid, blocked_name: nome});
  if (error) return toast('Erro ao bloquear: ' + pt(error.message), true);
  await loadBlocks(); await loadActs(); await loadDms(); S.verP = null;
  if (S.dm && !S.dms.some(t => t.id === S.dm)) { fechaDm(); S.dm = null; }
  if (S.group) { if (S.acts.some(a => a.id === S.group)) await loadMsgs(); else { fechaCanal(); S.group = null; } }
  render(); renderChat();
}
async function desbloquear(uid) {
  const {error} = await sb.from('blocks').delete().match({blocker_id: S.user.id, blocked_id: uid});
  if (error) return toast('Erro: ' + pt(error.message), true);
  await loadBlocks(); await loadActs(); render();
}

// ---------- Avaliações ----------
const hoje = () => new Date().toLocaleDateString('en-CA'); // AAAA-MM-DD
const passou = a => a.date_mode === 'definida' && a.event_date && a.event_date <= hoje();
function mediaTxt(a) {
  if (!a.reviews || !a.reviews.length) return '';
  const m = a.reviews.reduce((t, r) => t + r.rating, 0) / a.reviews.length;
  return `<span class="st">★</span> ${m.toFixed(1).replace('.', ',')} (${a.reviews.length})`;
}
function avaliacaoHtml(a) {
  if (!passou(a)) return `<h3 style="margin-top:18px">Avaliação</h3><p class="meta">A avaliação abre depois da data da atividade${a.date_mode === 'definida' ? '' : ' (defina a data primeiro)'}.</p>`;
  const minha = a.reviews.find(r => r.user_id === S.user.id);
  const nota = S.nota ?? minha?.rating ?? 0;
  const outros = a.reviews.filter(r => r.comment).map(r => `<div class="meta" style="margin-top:8px">${'★'.repeat(r.rating)} <b>${esc(r.profiles?.name || 'Alguém')}</b>: ${esc(r.comment)}</div>`).join('');
  return `<h3 style="margin-top:18px">Avaliação ${mediaTxt(a) ? '· ' + mediaTxt(a) : ''}</h3><div class="card"><p class="meta" style="margin-top:0">Como foi a experiência?</p>
  <div class="pills" id="est">${[1,2,3,4,5].map(n => `<button class="pill ${nota >= n ? 'on' : ''}" onclick="setNota(${n})">${n}★</button>`).join('')}</div>
  <textarea id="rc" rows="2" maxlength="300" placeholder="Comentário (opcional)">${esc(minha?.comment)}</textarea>
  <button class="full" onclick="salvaAval()">${minha ? 'Atualizar avaliação' : 'Enviar avaliação'}</button>${outros}</div>`;
}
function setNota(n) { S.nota = n; document.querySelectorAll('#est .pill').forEach((b, i) => b.classList.toggle('on', i + 1 <= n)); }
async function salvaAval() {
  const a = S.acts.find(x => x.id === S.group);
  const minha = a.reviews.find(r => r.user_id === S.user.id);
  const nota = S.nota ?? minha?.rating;
  if (!nota) return toast('Escolha de 1 a 5 estrelas.', true);
  const {error} = await sb.from('reviews').upsert({activity_id: S.group, user_id: S.user.id, rating: nota, comment: $('rc').value.trim() || null}, {onConflict: 'activity_id,user_id'});
  if (error) return toast('Não foi possível salvar: ' + pt(error.message), true);
  S.nota = null; await loadActs(); render(); renderChat(); toast('Avaliação salva. Obrigado!');
}

// ---------- Notificações ----------
async function loadNotifs() {
  const {data, error} = await sb.from('notifications').select('*').order('created_at', {ascending: false}).limit(30);
  S.notifErr = error ? error.message : null;
  S.notifs = data || [];
}
const naoLidas = () => S.notifs.filter(n => !n.read).length;
function sinoHtml() { const n = naoLidas(); return `<button class="sino" onclick="abreNotif()" aria-label="Notificações">${ic('bell')}<span id="sinoN" class="badge" style="display:${n ? 'grid' : 'none'}">${n}</span></button>`; }
function refreshSino() {
  const b = $('sinoN'); if (b) { const n = naoLidas(); b.textContent = n; b.style.display = n ? 'grid' : 'none'; }
  const p = $('npanel'); if (p) p.outerHTML = notifPanel();
}
function assinaNotif() {
  if (S.notifCanal) sb.removeChannel(S.notifCanal);
  S.notifCanal = sb.channel('notif-' + S.user.id).on('postgres_changes',
    {event: 'INSERT', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + S.user.id},
    async () => { await loadNotifs(); refreshSino(); }).subscribe();
}
function notifPanel() {
  const quando = d => new Date(d).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
  return `<div id="npanel" class="modal" onclick="if(event.target===this)fechaNotif()"><div class="card" style="max-height:80vh;overflow:auto">
  <div class="row" style="align-items:center"><h3 style="margin:0">Notificações</h3><button class="link" style="text-align:right" onclick="lerTodas()">Marcar todas como lidas</button></div>
  ${S.notifErr ? `<div class="msg erro">Erro ao carregar os avisos: ${esc(S.notifErr)}</div>` : ''}
  ${S.notifs.length ? S.notifs.map(n => `<div class="notif ${n.read ? '' : 'nova'}" onclick="abreNotificacao('${n.id}','${n.activity_id}')">${esc(n.text)}<div class="meta">${quando(n.created_at)}</div></div>`).join('') : '<p class="meta">Nenhuma notificação por enquanto.</p>'}
  <button class="sec full" onclick="fechaNotif()">Fechar</button></div></div>`;
}
function abreNotif() { fechaNotif(); document.body.insertAdjacentHTML('beforeend', notifPanel()); }
function fechaNotif() { const p = $('npanel'); if (p) p.remove(); }
async function lerTodas() {
  await sb.from('notifications').update({read: true}).eq('user_id', S.user.id).eq('read', false);
  await loadNotifs(); refreshSino();
}
async function abreNotificacao(id, actId) {
  await sb.from('notifications').update({read: true}).eq('id', id);
  await loadNotifs(); fechaNotif(); refreshSino();
  S.tab = 'comunidade'; S.edit = null;
  if (S.acts.some(a => a.id === actId)) await abrirGrupo(actId);
  else { fechaCanal(); fechaDm(); S.group = null; S.dm = null; S.comTab = 'conversas'; await loadDms(); render(); } // aviso de conversa privada
}

// ---------- App instalável ----------
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.instalar = e; });
function instalarHtml() {
  if (window.matchMedia('(display-mode: standalone)').matches) return '';
  return `<div class="card" style="margin-top:20px"><h3>Instalar o app</h3>${S.instalar
    ? '<button class="full" onclick="instalarApp()">Instalar Bora Junto</button>'
    : '<p class="meta" style="margin:0">Android (Chrome): menu ⋮ e depois Instalar app.<br>iPhone (Safari): botão Compartilhar e depois Adicionar à Tela de Início.</p>'}</div>`;
}
async function instalarApp() { const e = S.instalar; S.instalar = null; render(); if (e) e.prompt(); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- Render ----------
const ABAS = [['inicio','Início','home'],['explorar','Explorar','compass'],['criar','Criar','plus'],['comunidade','Comunidade','users'],['perfil','Perfil','user']];
function render() {
  const dl = `<datalist id="cidades">${CIDADES.map(c => `<option value="${c}">`).join('')}</datalist>`;
  if (S.user === undefined) { $('app').innerHTML = '<div class="splash" role="status" aria-label="Carregando"><b>Bora Junto</b><div class="spin"></div></div>'; return; }
  if (!S.user) { $('app').innerHTML = telaAuth(); return; }
  if (S.recovery) { $('app').innerHTML = telaNovaSenha(); return; }
  if (S.avEdit) { $('app').innerHTML = telaAvatar(); return; }
  const tela = {inicio:telaInicio, explorar:telaExplorar, criar:telaCriar, comunidade:telaComunidade, perfil:telaPerfil}[S.tab]();
  $('app').innerHTML = `<main>${tela}</main>` + dl + `<nav aria-label="Navegação principal">${ABAS.map(([k,n,i]) => k === 'criar' ? `<button class="mais" onclick="go('criar')"><span>${ic(i, 26)}</span>${n}</button>` : `<button class="${S.tab===k?'on':''}" ${S.tab===k?'aria-current="page"':''} onclick="go('${k}')">${ic(i, 22)}${n}${k === 'comunidade' ? `<i id="dmN" class="nb" style="display:${dmAvisos() ? 'inline-grid' : 'none'}">${dmAvisos()}</i>` : ''}</button>`).join('')}</nav>` + sinoHtml() + modalHtml() + pessoaHtml();
}
// Fecha os menus "⋯" ao tocar fora deles
document.addEventListener('click', e => document.querySelectorAll('details.menu[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; }));
// Aviso de sem conexão
const rede = () => document.body.classList.toggle('off', !navigator.onLine);
addEventListener('online', rede); addEventListener('offline', rede); rede();
sb.auth.onAuthStateChange((_ev, session) => {
  if (_ev === 'PASSWORD_RECOVERY') S.recovery = true;
  S.user = session?.user ?? null;
  // setTimeout evita travar o Supabase ao fazer consultas dentro deste evento
  setTimeout(async () => {
    try {
      if (S.user) { await loadProfile(); await loadBlocks(); await loadNotifs(); assinaNotif(); await loadActs(); await loadDms(); assinaDm(); } else { S.profile = null; S.acts = []; S.notifs = []; S.dms = []; S.dm = null; S.parts = {}; fechaDm(); if (S.dmtCanal) { sb.removeChannel(S.dmtCanal); S.dmtCanal = null; } if (S.notifCanal) { sb.removeChannel(S.notifCanal); S.notifCanal = null; } }
    } catch (e) { toast('Erro ao carregar: ' + pt(e.message), true); }
    render();
  }, 0);
});
render();
</script>
</body>
</html>
